# STEP3 pipeline config (technical_details/step3_plan_frontier_kd.md). Change `tag` for a fresh set of job names.
tag: s3a
n_prompts: 17000          # outputs/step3/prompts.jsonl (Tulu-3 8k incl. its math subsets, MATH train 6k, Magicoder 2k, no_robots 1k)
rollout_shards: 4
rollout_batch: 1          # batching gives no speed-up (512 full forwards per prompt); batch 1 = the official single-prompt run exactly

# student init (user 2026-10-15): the official Ins with teacher A(2.0) is the main line (gate 36.7 -> 49.0; A(2.0) = A(1.5) within noise, one teacher ckpt for all arms);
# m46 = best merge M(.4,.6) (gate 42.0 -> 51.0) is the second-init arm. Arms inherit `student` unless they set their own.
student: ins
students:
  ins: Dream-org/Dream-v0-Instruct-7B
  m46: /mnt/lts4/scratch/home/yqin/DllmAR/dream_study/step2_instruct/outputs/checkpoints/dream-ins-04a_D-06a_A
# shared training hyperparameters (plan §2–3): replayed frames (2 before a low-confidence commit + 1 uniform per canvas per epoch), gate-shaped loss,
# LoRA r64/alpha128, lr 1e-4, 2 epochs, batch 32 frames
train_args: "--corruption replay --anchor self --lambda-anchor 0.3 --low-frames 2 --uniform-frames 1 --kl reverse --top-k 0 --kd-temp 1.0 --theta 0.8 --epochs 2 --batch 32 --lr 1e-4 --lora-r 64 --lora-alpha 128 --max-len 1024"

# arms: teacher = beta on the addition line A(beta) = D_b + tau_D + beta*tau_A (null = no teacher). extra = arm-specific train args; student overrides the global init.
arms:
  M:  {teacher: 2.0}                        # Ins <= A(2.0): unsure -> teacher, sure -> anchor to untouched student   (the method)
  M06: {teacher: 2.0, extra: "--theta 0.6"} # less teacher: theta 0.6 (gate @0.6 ~= @0.8 in accuracy with half the hand-overs)
  Mm: {teacher: 2.0, student: m46}          # same as M, from the best merge M(.4,.6) (higher start, 51.0 gate ceiling; needs its own rollouts)
  Msch: {teacher: 2.0, extra: "--theta-end 0.5"}   # threshold decays 0.8 -> 0.5 over training: distil less and less (user idea)
  C2: {teacher: null}                       # self-SFT on the rollout token         (is the teacher needed)
  C1: {teacher: 2.0, extra: "--anchor none"}   # every NEXT position -> teacher, no split      (is selection needed)
  C3: {teacher: 1.1}                        # non-over teacher A(1.1) = best addition         (is "over" needed)
  C4: {teacher: 2.0, extra: "--corruption random"}   # random-mask corruption                  (is the replayed state needed)
  C5: {teacher: 2.0, extra: "--kl forward"} # forward KL instead of reverse                               (divergence direction)
# C6 (RFT on GT-correct MATH rollouts) and C7 (plain SFT on reference responses) use the official Dream SFT trainer, not this one — not wired yet.
first_wave: [M, M06, C2]
guard_arms: [M]            # GSM8K / HumanEval+ / IFEval only for arms that clear the MATH bar (plan §4); add arms here after reading MATH
